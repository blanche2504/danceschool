{% extends "base.html" %}
{% block content %}
    {% if object.pk %}
        <h1>Modifica il Giorno {{ object.pk }}</h1>
    {% else %}
        <h1>Inserisci un nuovo Giorno</h1>
    {% endif %}
    <form action="" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Invia">
    </form>
{% endblock %}
